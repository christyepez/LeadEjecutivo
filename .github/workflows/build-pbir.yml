name: Build PBIR
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_pbir.py'
      - '.github/pbir-trigger.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize LeadEjecutivo V1.10
        run: python scripts/build_pbir.py
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, pathlib
          for f in pathlib.Path('LeadEjecutivo.Report').rglob('*.json'):
              json.loads(f.read_text(encoding='utf-8'))
          print('JSON validation passed')
          PY
      - name: Commit generated PBIP sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LeadEjecutivo.pbip LeadEjecutivo.Report LeadEjecutivo.SemanticModel README.md docs .github/workflows/validate.yml
          git diff --cached --quiet || git commit -m "build: materialize admissions model and PBIR V1.10"
          git push
