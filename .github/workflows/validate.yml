name: Validate PBIP
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PBIP, PBIR and TMDL structure
        shell: python
        run: |
          import json, pathlib, re

          root = pathlib.Path('.')
          required = [
              'LeadEjecutivo.pbip',
              'LeadEjecutivo.Report/definition.pbir',
              'LeadEjecutivo.Report/definition/version.json',
              'LeadEjecutivo.Report/definition/report.json',
              'LeadEjecutivo.Report/definition/pages/pages.json',
              'LeadEjecutivo.SemanticModel/definition.pbism',
              'LeadEjecutivo.SemanticModel/definition/model.tmdl',
              'LeadEjecutivo.SemanticModel/definition/database.tmdl',
              'LeadEjecutivo.SemanticModel/definition/relationships.tmdl',
          ]
          for p in required:
              assert (root / p).exists(), f'Missing required artifact: {p}'

          for f in root.rglob('*.json'):
              json.loads(f.read_text(encoding='utf-8'))

          pbir = json.loads((root/'LeadEjecutivo.Report/definition.pbir').read_text(encoding='utf-8'))
          assert float(pbir.get('version','0')) >= 4.0, 'PBIR folder format requires definition.pbir version 4.0+'
          assert pbir.get('datasetReference',{}).get('byPath',{}).get('path') == '../LeadEjecutivo.SemanticModel', 'Invalid semantic model byPath reference'

          report_version = json.loads((root/'LeadEjecutivo.Report/definition/version.json').read_text(encoding='utf-8'))
          assert report_version.get('version') == '2.0.0', 'PBIR definition/version.json must be 2.0.0'

          pages = json.loads((root/'LeadEjecutivo.Report/definition/pages/pages.json').read_text(encoding='utf-8'))
          assert pages.get('pageOrder'), 'pageOrder is empty'
          assert pages.get('activePageName') in pages['pageOrder'], 'activePageName is not in pageOrder'
          for page_id in pages['pageOrder']:
              assert (root/f'LeadEjecutivo.Report/definition/pages/{page_id}/page.json').exists(), f'Missing page.json for {page_id}'

          pbism = json.loads((root/'LeadEjecutivo.SemanticModel/definition.pbism').read_text(encoding='utf-8'))
          assert float(pbism.get('version','0')) >= 4.0, 'TMDL semantic models require definition.pbism version 4.0+'

          definition_dir = root/'LeadEjecutivo.SemanticModel/definition'
          assert definition_dir.is_dir(), 'TMDL definition folder is missing'
          assert not (root/'LeadEjecutivo.SemanticModel/model.bim').exists(), 'Do not mix TMDL definition/ with model.bim'
          for f in definition_dir.rglob('*.tmdl'):
              text = f.read_text(encoding='utf-8')
              assert '\\t' not in text, f'Literal tab escape found in TMDL: {f}'
              unsupported_descriptions = [ln for ln in text.splitlines() if re.match(r'^\s+description\s*:', ln)]
              assert not unsupported_descriptions, f'Unsupported description property in TMDL: {f}: {unsupported_descriptions[:3]}'

          model_text = (definition_dir/'model.tmdl').read_text(encoding='utf-8')
          bad_refs = [ln for ln in model_text.splitlines() if re.match(r'^\s+ref\s+', ln)]
          assert not bad_refs, f'TMDL ref objects must be root-level, not indented: {bad_refs[:5]}'
          root_refs = [ln for ln in model_text.splitlines() if ln.startswith('ref table ')]
          assert root_refs, 'model.tmdl must contain root-level table references'

          print('PBIP/PBIR/TMDL structure validation passed')
